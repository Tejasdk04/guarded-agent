[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardedagent"
version = "0.1.0"
description = "A LangGraph agent that cannot overspend, cannot loop forever, and cannot take an irreversible action without a gate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Tejas Kshirsagar" }]
keywords = ["langgraph", "agents", "guardrails", "budget", "llm", "observability", "tracing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
]
dependencies = ["langgraph>=0.2", "typing-extensions>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
guardedagent = "guardedagent.cli:main"

[project.urls]
Homepage = "https://github.com/Tejasdk04/guarded-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
